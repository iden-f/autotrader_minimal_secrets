# NOTE ON THE FILENAME
# This lives at watch.yml, not the old run_bot.yml, on purpose. GitHub keys a
# workflow by its file path and remembers that run_bot.yml was disabled on
# 2026-01-08 - renaming the `name:` would not have cleared that, and the bot
# would have stayed silently switched off after merging. A new path registers
# as a new workflow, enabled by default.

name: Check AutoTrader

on:
  schedule:
    # Every two hours, on an off-peak minute.
    #
    # It was every 30 minutes, plus a ledger workflow on its own 30-minute
    # schedule that chained into this one, plus three "pacemaker" workflows
    # each holding a runner for five and a half hours to dispatch checks on a
    # timer. That was up to sixteen hours of runner a day to watch a page that
    # changes a few times a week, and it was justified by "the repository is
    # public, so the minutes are free". The minutes ARE free - GitHub reports
    # zero billable milliseconds against every one of these runs - but free
    # compute on someone else's machines is still someone else's machines, and
    # a bill one settings change away from being real.
    #
    # Twelve checks a day, one job each, is the whole schedule now. What that
    # costs and what it buys is measured in ARCHITECTURE.md rather than
    # asserted.
    - cron: '11 */2 * * *'

  # Check straight away when the watch list changes, instead of leaving someone
  # who just added a search waiting half an hour to find out whether it works.
  # The bot's own commits carry [skip ci], so this cannot loop.
  push:
    branches: [main]
    paths:
      - 'config.json'
      - '.github/workflows/watch.yml'

  # Anything outside Actions can ask for a check with one authenticated POST.
  # This is the lever that does not depend on GitHub's scheduler at all: a
  # phone shortcut, a cron on any machine that is already on, a webhook from
  # something else entirely. See RUNBOOK.md for the exact call.
  repository_dispatch:
    types: [check]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without sending anything'
        type: boolean
        default: false
      automatic:
        description: 'Set by the pacemaker. A check nobody typed by hand.'
        type: boolean
        default: false

# Two runs pushing to the same branch collide, so scheduled runs queue behind
# each other. The soak deliberately does NOT share this group: it holds a
# runner for hours, and sharing meant one long soak silenced the watcher for
# the whole of it. They can overlap safely because every push here rebases and
# retries, and the generated files resolve in favour of the newer run.
concurrency:
  group: autotrader-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The cost guard, before anything is installed or fetched.
      #
      # BUDGET-STOP is written by the bot itself when its own projection says
      # this month's runner minutes are heading past the allowance. It is the
      # same shape as the old PACEMAKER-OFF switch and can be deleted by hand,
      # but nothing here writes it by hand: see autotrader/budget.py.
      - name: Stop if this month's budget is spent
        id: guard
        run: |
          if [ -f BUDGET-STOP ]; then
            {
              echo "## Stopped on budget"
              echo ''
              cat BUDGET-STOP
              echo ''
              echo 'Delete BUDGET-STOP at the top of the repository to resume.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::BUDGET-STOP is present - not checking."
            echo "stop=1" >> "$GITHUB_OUTPUT"
          else
            echo "stop=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: ${{ !steps.guard.outputs.stop }}
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: ${{ !steps.guard.outputs.stop }}
        run: pip install -r requirements.txt

      # Idempotent: on a fresh install this adopts the old SEARCH_URL secret
      # and sets up a private ntfy topic so the bot can reach you without any
      # token at all. On every run after that it prints the state and exits.
      - name: First-run setup
        if: ${{ !steps.guard.outputs.stop }}
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
        run: |
          set -o pipefail
          python -m autotrader --no-colour setup --non-interactive | tee setup.log
          {
            echo "## Setup"
            echo '```'
            cat setup.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One-shot: committing a .capture-raw marker asks the next run to save
      # the live search page itself, gzipped, so a parser strategy can be
      # rewritten against real markup instead of a guess at it. The marker
      # deletes itself so this cannot become a standing cost.
      - name: Capture the live page on request
        if: hashFiles('.capture-raw') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          python -m autotrader --no-colour capture --raw | tee capture.log
          rm -f .capture-raw
          {
            echo "## Raw page capture"
            echo '```'
            cat capture.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for new listings
        id: bot
        if: ${{ !steps.guard.outputs.stop }}
        env:
          # Whether this repository has the Issues feature on. The dashboard
          # has two ways to write a config change back - open an issue, or
          # commit a file - and picking the wrong one gives a button that
          # 404s. GitHub knows the answer; there is no reason to guess it.
          REPO_HAS_ISSUES:     ${{ github.event.repository.has_issues }}
          # Public repositories are not charged for Actions. GitHub knows
          # which this is; the bot should not have to be told twice, and a
          # config value somebody has to keep in step with reality is a
          # config value that will one day be wrong.
          REPO_VISIBILITY:     ${{ github.event.repository.visibility }}
          # Non-secret settings live in config.json. Only credentials are here,
          # and every one of them is optional - the bot enables whichever
          # channels it finds and says so in the log.
          SEARCH_URL:          ${{ secrets.SEARCH_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOKEN:          ${{ secrets.NTFY_TOKEN }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          TWILIO_SID:          ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:        ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM:         ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:           ${{ secrets.TWILIO_TO }}
          # Only a schedule firing twice is deduplicated; a run someone asked
          # for always happens. GitHub fires cron late, early, twice or not at
          # all, and two checks minutes apart cost requests to tell you the
          # same thing.
          AUTOTRADER_SCHEDULED: ${{ (github.event_name == 'schedule'
            || github.event_name == 'repository_dispatch'
            || inputs.automatic) && '1' || '' }}
        run: |
          set -o pipefail
          python -m autotrader --no-colour run ${{ inputs.dry_run && '--dry-run' || '' }} | tee run.log
        # The bot exits non-zero when a search failed. State is already saved by
        # then, so the commit below must still happen; the job is failed at the
        # end instead, after the results are safely stored.
        continue-on-error: true

      # The market-events ledger, recorded here rather than in a workflow of
      # its own that ran after every check. It reads what this run just wrote
      # and never scrapes, so it costs seconds inside a job that is already
      # running instead of a whole job-minute beside it. events.yml keeps its
      # own schedule for the one thing this cannot do: notice that no check
      # has happened at all.
      - name: Record market events
        if: ${{ !inputs.dry_run && !steps.guard.outputs.stop }}
        continue-on-error: true
        run: python -m autotrader --no-colour events --notify | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save results
        id: save
        if: ${{ !inputs.dry_run && !steps.guard.outputs.stop }}
        run: |
          set -u
          git config user.name  "autotrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add -A a b c` stages NOTHING if any pathspec is missing, and
          # `diagnostics/` only exists after a failed parse. That silently
          # discarded a successful run's results, so add each path separately.
          #
          # "if it exists" is not the test, though: a path the run *deleted*
          # no longer exists, so guarding on that alone means the deletion is
          # never staged. That is why the one-shot .capture-raw marker kept
          # coming back - it was removed on disk every run and restored by the
          # next checkout, re-capturing the page forever. A path git already
          # tracks is staged whether it is still there or not.
          for path in state.json docs/data.json docs/thumbs archives config.json \
                      NOTIFY.md diagnostics validation-report.md .capture-raw \
                      EVENTS.md docs/events.json BUDGET-STOP; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing changed"
            echo "changed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=1" >> "$GITHUB_OUTPUT"
          # Whether the PAGE changed, as opposed to state bookkeeping. A check
          # that found nothing new still rewrites generated_at in data.json,
          # and republishing for a new timestamp is a job-minute for nothing.
          if git diff --cached --stat -- docs/ | grep -q .; then
            if git diff --cached -- docs/data.json \
               | grep -E '^[+-]' | grep -vE '^[+-]{3}' \
               | grep -vq '"generated_at"'; then
              echo "page=1" >> "$GITHUB_OUTPUT"
            else
              echo "page=" >> "$GITHUB_OUTPUT"
              echo "only the timestamp changed - not republishing"
            fi
          fi
          git commit -m "Update listings [skip ci]"
          # Another run may have pushed while this one was scraping; rebase
          # rather than failing, and retry a few times on a busy repository.
          for attempt in 1 2 3 4 5; do
            # A conflict leaves the repository mid-rebase and every later git
            # command fails against that, so clear it before trying again.
            git rebase --abort 2>/dev/null || true
            # state.json and docs/data.json are generated. What this run just
            # wrote is the newer truth; a batch job has no business resolving
            # a merge in them.
            if git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 4))
          done
          git rebase --abort 2>/dev/null || true
          echo "could not push after 5 attempts"
          exit 1

      - name: Upload logs and the first-run parse check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: |
            run.log
            setup.log
            validation-report.md
            diagnostics/
          retention-days: 30
          if-no-files-found: ignore

      # The first real run against the live site is the first time anyone finds
      # out whether the search-results parser works. It writes its verdict here.
      - name: Show the first-run parse check
        if: always() && hashFiles('validation-report.md') != ''
        run: cat validation-report.md >> "$GITHUB_STEP_SUMMARY"

      # Publishing used to be a second job, which called pages.yml, which
      # checked the repository out again, installed Python again and rebuilt
      # the data file this job had just written. GitHub rounds every JOB up to
      # a whole minute, so that second job doubled the cost of a check to buy
      # a duplicate of work already done.
      #
      # Here it is a step, it reuses what is already on disk, and it is skipped
      # entirely when the only thing that changed in data.json was its own
      # timestamp.
      - name: Publish the dashboard
        if: ${{ steps.save.outputs.page && !inputs.dry_run }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          from autotrader.dashboard import find_secrets
          data = json.loads(pathlib.Path("docs/data.json").read_text())
          print(f"listings: {len(data['listings'])}, searches: {len(data['searches'])}")
          if not data["listings"]:
              print("::warning::the dashboard has no listings in it")
          leaks = find_secrets(data)
          if leaks:
              sys.exit("refusing to publish, credential-shaped data at: "
                       + "; ".join(leaks[:5]))
          print("no credentials in the payload")
          PY
          site="$(mktemp -d)"
          cp -r docs/. "$site/"
          touch "$site/.nojekyll"
          git config user.name  "autotrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r "$site/." .
          git add -A
          git commit -m "Publish dashboard from ${GITHUB_SHA::7}"
          git push --force origin gh-pages-tmp:gh-pages
          {
            echo "### Dashboard published"
            echo ""
            echo "<https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: steps.bot.outcome == 'failure'
        run: |
          echo "::error::The bot reported a problem. Results were still saved."
          if [ -f validation-report.md ] && grep -q "looks wrong" validation-report.md; then
            echo "::error::The first-run parse check failed - nothing was recorded."
          fi
          tail -40 run.log || true
          exit 1

