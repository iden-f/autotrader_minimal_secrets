# NOTE ON THE FILENAME
# This lives at watch.yml, not the old run_bot.yml, on purpose. GitHub keys a
# workflow by its file path and remembers that run_bot.yml was disabled on
# 2026-01-08 - renaming the `name:` would not have cleared that, and the bot
# would have stayed silently switched off after merging. A new path registers
# as a new workflow, enabled by default.

name: Check AutoTrader

on:
  schedule:
    # Every 30 minutes. GitHub queues scheduled jobs on a best-effort basis and
    # drops them under load - asking for one every ten minutes this evening
    # produced none at all for twenty minutes at a stretch - so a shorter
    # interval buys nothing but a less predictable one. The old workflow asked
    # for 96 runs a day and got far fewer, unevenly.
    #
    # But not */30. That asks for :00 and :30, the two most contended minutes of
    # every hour on GitHub's shared scheduler, and asking for them has not
    # been working: measured here, the schedule was served once in the twelve
    # hours this workflow has existed, and every other check today came from a
    # push. Off-peak minutes are the one lever available - the API cannot be
    # asked to run a workflow with the token this repository has.
    - cron: '13,43 * * * *'

  # Check straight away when the watch list changes, instead of leaving someone
  # who just added a search waiting half an hour to find out whether it works.
  # The bot's own commits carry [skip ci], so this cannot loop.
  push:
    branches: [main]
    paths:
      - 'config.json'
      - '.github/workflows/watch.yml'

  # And on the ledger's schedule as well as this one. Both are drawn from the
  # same best-effort pool, but they are not dropped together: this morning the
  # watcher's cron was served none of its eight slots in four hours while the
  # ledger's was served one - and that one run is what noticed the silence.
  # Riding on it too turns two unreliable schedules into one less unreliable
  # one, which is the only lever available here. The API cannot be asked to
  # start a run: this token has no actions: write.
  workflow_run:
    workflows: ['Record market events']
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without sending anything'
        type: boolean
        default: false
      automatic:
        description: 'Set by the pacemaker. A check nobody typed by hand.'
        type: boolean
        default: false

# Two runs pushing to the same branch collide, so scheduled runs queue behind
# each other. The soak deliberately does NOT share this group: it holds a
# runner for hours, and sharing meant one long soak silenced the watcher for
# the whole of it. They can overlap safely because every push here rebases and
# retries, and the generated files resolve in favour of the newer run.
concurrency:
  group: autotrader-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    # Only a ledger run that GitHub's scheduler started may start a check. The
    # ledger also runs after every check, and letting that one start another
    # check is two workflows taking turns forever with a runner each.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Idempotent: on a fresh install this adopts the old SEARCH_URL secret
      # and sets up a private ntfy topic so the bot can reach you without any
      # token at all. On every run after that it prints the state and exits.
      - name: First-run setup
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
        run: |
          set -o pipefail
          python -m autotrader --no-colour setup --non-interactive | tee setup.log
          {
            echo "## Setup"
            echo '```'
            cat setup.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One-shot: committing a .capture-raw marker asks the next run to save
      # the live search page itself, gzipped, so a parser strategy can be
      # rewritten against real markup instead of a guess at it. The marker
      # deletes itself so this cannot become a standing cost.
      - name: Capture the live page on request
        if: hashFiles('.capture-raw') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          python -m autotrader --no-colour capture --raw | tee capture.log
          rm -f .capture-raw
          {
            echo "## Raw page capture"
            echo '```'
            cat capture.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for new listings
        id: bot
        env:
          # Non-secret settings live in config.json. Only credentials are here,
          # and every one of them is optional - the bot enables whichever
          # channels it finds and says so in the log.
          SEARCH_URL:          ${{ secrets.SEARCH_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOKEN:          ${{ secrets.NTFY_TOKEN }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          TWILIO_SID:          ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:        ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM:         ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:           ${{ secrets.TWILIO_TO }}
          # Only a schedule firing twice is deduplicated; a run someone asked
          # for always happens. GitHub fires cron late, early, twice or not at
          # all, and two checks minutes apart cost requests to tell you the
          # same thing.
          AUTOTRADER_SCHEDULED: ${{ (github.event_name == 'schedule'
            || github.event_name == 'workflow_run'
            || inputs.automatic) && '1' || '' }}
        run: |
          set -o pipefail
          python -m autotrader --no-colour run ${{ inputs.dry_run && '--dry-run' || '' }} | tee run.log
        # The bot exits non-zero when a search failed. State is already saved by
        # then, so the commit below must still happen; the job is failed at the
        # end instead, after the results are safely stored.
        continue-on-error: true

      - name: Save results
        if: ${{ !inputs.dry_run }}
        run: |
          set -u
          git config user.name  "autotrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add -A a b c` stages NOTHING if any pathspec is missing, and
          # `diagnostics/` only exists after a failed parse. That silently
          # discarded a successful run's results, so add each path separately.
          #
          # "if it exists" is not the test, though: a path the run *deleted*
          # no longer exists, so guarding on that alone means the deletion is
          # never staged. That is why the one-shot .capture-raw marker kept
          # coming back - it was removed on disk every run and restored by the
          # next checkout, re-capturing the page forever. A path git already
          # tracks is staged whether it is still there or not.
          for path in state.json docs/data.json docs/thumbs archives config.json \
                      NOTIFY.md diagnostics validation-report.md .capture-raw; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Update listings [skip ci]"
          # Another run may have pushed while this one was scraping; rebase
          # rather than failing, and retry a few times on a busy repository.
          for attempt in 1 2 3 4 5; do
            # A conflict leaves the repository mid-rebase and every later git
            # command fails against that, so clear it before trying again.
            git rebase --abort 2>/dev/null || true
            # state.json and docs/data.json are generated. What this run just
            # wrote is the newer truth; a batch job has no business resolving
            # a merge in them.
            if git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 4))
          done
          git rebase --abort 2>/dev/null || true
          echo "could not push after 5 attempts"
          exit 1

      - name: Upload logs and the first-run parse check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: |
            run.log
            setup.log
            validation-report.md
            diagnostics/
          retention-days: 30
          if-no-files-found: ignore

      # The first real run against the live site is the first time anyone finds
      # out whether the search-results parser works. It writes its verdict here.
      - name: Show the first-run parse check
        if: always() && hashFiles('validation-report.md') != ''
        run: cat validation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: steps.bot.outcome == 'failure'
        run: |
          echo "::error::The bot reported a problem. Results were still saved."
          if [ -f validation-report.md ] && grep -q "looks wrong" validation-report.md; then
            echo "::error::The first-run parse check failed - nothing was recorded."
          fi
          tail -40 run.log || true
          exit 1

  # Refresh the published dashboard with whatever the run just found.
  publish:
    needs: check
    # always() runs this even when the check was skipped, which used to be
    # harmless and is not any more: a run that publishes without checking
    # still counts as this workflow completing, which starts the ledger,
    # which starts this workflow. Nothing to publish when nothing ran.
    if: ${{ always() && !inputs.dry_run && needs.check.result != 'skipped' }}
    permissions:
      contents: write
    uses: ./.github/workflows/pages.yml
