# NOTE ON THE FILENAME
# This lives at watch.yml, not the old run_bot.yml, on purpose. GitHub keys a
# workflow by its file path and remembers that run_bot.yml was disabled on
# 2026-01-08 - renaming the `name:` would not have cleared that, and the bot
# would have stayed silently switched off after merging. A new path registers
# as a new workflow, enabled by default.

name: Check AutoTrader

on:
  schedule:
    # Hourly while the soak test runs. The soak holds this same concurrency
    # group for hours at a time, and a scheduled run that arrives meanwhile is
    # queued and then superseded - so asking for one every ten minutes buys
    # nothing but a column of cancelled runs. The soak is the cadence for now;
    # this goes back to '*/30 * * * *' when it finishes.
    - cron: '5 * * * *'

  # Check straight away when the watch list changes, instead of leaving someone
  # who just added a search waiting half an hour to find out whether it works.
  # The bot's own commits carry [skip ci], so this cannot loop.
  push:
    branches: [main]
    paths:
      - 'config.json'
      - '.github/workflows/watch.yml'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without sending anything'
        type: boolean
        default: false

# Two runs pushing to the same branch collide. Let an in-flight run finish.
concurrency:
  group: autotrader-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Idempotent: on a fresh install this adopts the old SEARCH_URL secret
      # and sets up a private ntfy topic so the bot can reach you without any
      # token at all. On every run after that it prints the state and exits.
      - name: First-run setup
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
        run: |
          set -o pipefail
          python -m autotrader --no-colour setup --non-interactive | tee setup.log
          {
            echo "## Setup"
            echo '```'
            cat setup.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One-shot: committing a .capture-raw marker asks the next run to save
      # the live search page itself, gzipped, so a parser strategy can be
      # rewritten against real markup instead of a guess at it. The marker
      # deletes itself so this cannot become a standing cost.
      - name: Capture the live page on request
        if: hashFiles('.capture-raw') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          python -m autotrader --no-colour capture --raw | tee capture.log
          rm -f .capture-raw
          {
            echo "## Raw page capture"
            echo '```'
            cat capture.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for new listings
        id: bot
        env:
          # Non-secret settings live in config.json. Only credentials are here,
          # and every one of them is optional - the bot enables whichever
          # channels it finds and says so in the log.
          SEARCH_URL:          ${{ secrets.SEARCH_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOKEN:          ${{ secrets.NTFY_TOKEN }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          TWILIO_SID:          ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:        ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM:         ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:           ${{ secrets.TWILIO_TO }}
        run: |
          set -o pipefail
          python -m autotrader --no-colour run ${{ inputs.dry_run && '--dry-run' || '' }} | tee run.log
        # The bot exits non-zero when a search failed. State is already saved by
        # then, so the commit below must still happen; the job is failed at the
        # end instead, after the results are safely stored.
        continue-on-error: true

      - name: Save results
        if: ${{ !inputs.dry_run }}
        run: |
          set -u
          git config user.name  "autotrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add -A a b c` stages NOTHING if any pathspec is missing, and
          # `diagnostics/` only exists after a failed parse. That silently
          # discarded a successful run's results, so add each path separately.
          #
          # "if it exists" is not the test, though: a path the run *deleted*
          # no longer exists, so guarding on that alone means the deletion is
          # never staged. That is why the one-shot .capture-raw marker kept
          # coming back - it was removed on disk every run and restored by the
          # next checkout, re-capturing the page forever. A path git already
          # tracks is staged whether it is still there or not.
          for path in state.json docs/data.json archives config.json \
                      NOTIFY.md diagnostics validation-report.md .capture-raw; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Update listings [skip ci]"
          # Another run may have pushed while this one was scraping; rebase
          # rather than failing, and retry a few times on a busy repository.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 4))
          done
          echo "could not push after 5 attempts"
          exit 1

      - name: Upload logs and the first-run parse check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: |
            run.log
            setup.log
            validation-report.md
            diagnostics/
          retention-days: 30
          if-no-files-found: ignore

      # The first real run against the live site is the first time anyone finds
      # out whether the search-results parser works. It writes its verdict here.
      - name: Show the first-run parse check
        if: always() && hashFiles('validation-report.md') != ''
        run: cat validation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: steps.bot.outcome == 'failure'
        run: |
          echo "::error::The bot reported a problem. Results were still saved."
          if [ -f validation-report.md ] && grep -q "looks wrong" validation-report.md; then
            echo "::error::The first-run parse check failed - nothing was recorded."
          fi
          tail -40 run.log || true
          exit 1

  # Refresh the published dashboard with whatever the run just found.
  publish:
    needs: check
    if: ${{ always() && !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/pages.yml
