# Does this work for someone who has never run it?
#
# Every other job in this repository runs against state the bot has been
# building for hours. That hides a whole class of "it only works because
# something was already there" - so this one throws all of it away first: no
# state, no config, no archives, no notify file, nothing cached. Then it does
# what a new install does, against the real site.
#
# It never pushes. A cold start that wrote to main would stop being cold.

name: Cold start

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'autotrader/**'
      - '.github/workflows/coldstart.yml'

concurrency:
  group: autotrader-coldstart
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  from-nothing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Throw away everything a running install accumulates
        run: |
          set -eu
          rm -rf archives diagnostics
          rm -f state.json config.json NOTIFY.md seen_listings.json \
                validation-report.md SOAK.md EVENTS.md \
                docs/data.json docs/events.json
          echo "left with:"
          ls -A | tr '\n' ' '; echo

      - name: Set itself up from nothing
        run: |
          set -o pipefail
          python -m autotrader --no-colour setup --non-interactive | tee setup.log
          test -f config.json || { echo "::error::setup wrote no config"; exit 1; }
          test -f NOTIFY.md   || { echo "::error::setup left no way to be reached"; exit 1; }
          python - <<'PY'
          import json, pathlib, sys
          cfg = json.loads(pathlib.Path("config.json").read_text())
          topic = cfg["notifications"]["channels"]["ntfy"]["topic"]
          if not topic:
              sys.exit("setup enabled ntfy without a topic to send to")
          print(f"reachable on a freshly generated topic ({len(topic)} chars)")
          PY

      - name: Watch something
        run: |
          set -o pipefail
          python -m autotrader --no-colour add \
            "https://www.autotrader.ca/cars/bmw/m5/?prx=-2&inMarket=advancedSearch" | tee add.log

      - name: A real check, against the real site, with nothing cached
        run: |
          set -o pipefail
          # Never notify: this is a test install and its ntfy topic is one
          # nobody is subscribed to, but there is no reason to send to it.
          python -m autotrader --no-colour run --no-notify | tee run.log

      - name: And prove it actually worked
        run: |
          set -o pipefail
          python -m autotrader --no-colour doctor | tee doctor.log
          python - <<'PY'
          import json, pathlib, sys
          state = json.loads(pathlib.Path("state.json").read_text())
          run = state["runs"][0]
          problems = []
          if not run.get("ok"):
              problems.append(f"the run failed: {run.get('errors')}")
          if run.get("invariants"):
              problems.append(f"bookkeeping: {run['invariants']}")
          if not state["listings"]:
              problems.append("no listings were recorded from a live search")
          live = [e for e in state["listings"].values() if e.get("status") == "active"]
          if live and not any(e.get("price") for e in live):
              problems.append("not one listing came back with a price")
          shape = (state.get("searches") or {})
          working = [len(h.get("shape", {}).get("working", [])) for h in shape.values()]
          if working and min(working) < 2:
              problems.append(f"only {min(working)} parse strategy scored")
          data = json.loads(pathlib.Path("docs/data.json").read_text())
          if len(data["listings"]) != len(state["listings"]):
              problems.append("the dashboard and state disagree on how many cars there are")
          if data["health"]["accounted"]["unexplained"]:
              problems.append("a car was recorded that nobody decided about")

          print(f"from nothing: {len(live)} live listing(s), "
                f"{min(working) if working else 0} of 4 parsers, "
                f"{run.get('requests_made')} request(s)")
          if problems:
              sys.exit("::error::" + "; ".join(problems))
          print("a new install works")
          PY

      - name: Keep the evidence either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-${{ github.run_number }}
          path: |
            setup.log
            add.log
            run.log
            doctor.log
            state.json
            config.json
            docs/data.json
            diagnostics/
          retention-days: 14
          if-no-files-found: ignore
