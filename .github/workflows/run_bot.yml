name: Check AutoTrader

on:
  schedule:
    # Every 30 minutes. GitHub queues scheduled jobs on a best-effort basis and
    # drops them under load, so */15 does not actually run every 15 minutes -
    # the old workflow asked for 96 runs a day and got far fewer, unevenly.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without sending anything'
        type: boolean
        default: false

# Two runs pushing to the same branch collide. Let an in-flight run finish.
concurrency:
  group: autotrader-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new listings
        id: bot
        env:
          # Non-secret settings live in config.json. Only credentials are here,
          # and every one of them is optional - the bot enables whichever
          # channels it finds and says so in the log.
          SEARCH_URL:          ${{ secrets.SEARCH_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOKEN:          ${{ secrets.NTFY_TOKEN }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          TWILIO_SID:          ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:        ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM:         ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:           ${{ secrets.TWILIO_TO }}
        run: |
          python -m autotrader run ${{ inputs.dry_run && '--dry-run' || '' }} | tee run.log
        # The bot exits non-zero when a search failed. State is already saved by
        # then, so the commit below must still happen; the job is failed at the
        # end instead, after the results are safely stored.
        continue-on-error: true

      - name: Save results
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "autotrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state.json docs/data.json archives config.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Update listings [skip ci]"
          # Another run may have pushed while this one was scraping; rebase
          # rather than failing, and retry a few times on a busy repository.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 4))
          done
          echo "could not push after 5 attempts"
          exit 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_number }}
          path: run.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Report failure
        if: steps.bot.outcome == 'failure'
        run: |
          echo "::error::The bot reported a problem. Results were still saved."
          tail -30 run.log || true
          exit 1
