name: Tests

on:
  push:
    branches: ['**']
    # Everything the bot writes for itself. None of it can change
    # whether the tests pass, and a check every two hours that
    # re-ran the suite would be the largest line in the budget.
    paths-ignore:
      - 'state.json'
      - 'docs/data.json'
      - 'docs/events.json'
      - 'docs/thumbs/**'
      - 'archives/**'
      - 'EVENTS.md'
      - 'NOTIFY.md'
      - 'SOAK.md'
      - 'diagnostics/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # A job with no ceiling can hold its concurrency group for GitHub's
    # default six hours. Nothing here should ever take a fraction of that.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Config and dashboard smoke test
        run: |
          python -m autotrader --config /tmp/c.json --state /tmp/s.json list
          python -m autotrader --config /tmp/c.json add \
            "https://www.autotrader.ca/cars/bmw/m5/?rcp=15&srt=35&prx=-2&loc=M5V"
          python -m autotrader --config /tmp/c.json --state /tmp/s.json doctor || true
