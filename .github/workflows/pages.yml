name: Publish dashboard

# Publishes docs/ to the gh-pages branch, which GitHub Pages serves.
#
# WHY NOT actions/deploy-pages: that route needs the Pages *site* to exist
# first, and creating one requires admin rights that the workflow's
# GITHUB_TOKEN does not have ("Resource not accessible by integration"). A
# gh-pages branch needs nothing beyond contents: write, and GitHub serves it
# automatically on a public repository.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'state.json'
      - 'config.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

  # Called by the watcher after a run that changed something. The bot commits
  # its results with [skip ci] so it cannot re-trigger itself, but that also
  # suppresses this workflow's own push trigger - without this the dashboard
  # would never update after a run.
  workflow_call:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Rebuild the dashboard data
        run: |
          python -m autotrader dashboard
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("docs/data.json").read_text())
          print(f"listings: {len(data['listings'])}")
          print(f"searches: {len(data['searches'])}")
          print(f"generated: {data['generated_at']}")
          # A published page with no listings is usually a broken build, not an
          # empty garage - say so loudly rather than shipping it quietly. Not
          # fatal: a brand new install genuinely has none.
          if not data["listings"]:
              print("::warning::the dashboard has no listings in it")
          # Credentials must never reach a public page. Matching key names or
          # raw substrings gives false positives - data.json legitimately says
          # "TELEGRAM_BOT_TOKEN" as the name of a secret to set - so this looks
          # at values and at known credential shapes.
          from autotrader.dashboard import find_secrets
          leaks = find_secrets(data)
          if leaks:
              sys.exit("refusing to publish, credential-shaped data at: "
                       + "; ".join(leaks[:5]))
          print("no credentials in the payload")
          PY

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          cp -r docs/. "$site/"
          # Stop Jekyll from swallowing files it does not recognise.
          touch "$site/.nojekyll"

          git config user.name  "autotrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A single-commit branch: the dashboard is a build artifact, and
          # keeping its history would bloat the repository for no benefit.
          git checkout --orphan gh-pages-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r "$site/." .
          git add -A
          git commit -m "Publish dashboard from ${GITHUB_SHA::7}"
          git push --force origin gh-pages-tmp:gh-pages

          echo "### Dashboard published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If that 404s, set **Settings → Pages → Source: Deploy from a branch → gh-pages → / (root)** once." >> "$GITHUB_STEP_SUMMARY"
