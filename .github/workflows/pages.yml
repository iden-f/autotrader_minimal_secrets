name: Publish dashboard

# Publishes docs/ to GitHub Pages. The data file is rebuilt from the committed
# state during the build, so the published page always matches what the bot
# actually knows rather than whatever data.json happened to be committed.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'state.json'
      - 'config.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment, but only run one at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Rebuild the dashboard data
        run: |
          python -m autotrader dashboard
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("docs/data.json").read_text())
          print(f"listings: {len(data['listings'])}")
          print(f"searches: {len(data['searches'])}")
          print(f"generated: {data['generated_at']}")
          # A published page with no listings is usually a broken build, not an
          # empty garage - say so loudly in the log rather than shipping it
          # quietly. It is not fatal: a brand new install genuinely has none.
          if not data["listings"]:
              print("::warning::the dashboard has no listings in it")
          # Credentials must never reach a public page. Matching key names or
          # raw substrings gives false positives - data.json legitimately says
          # "TELEGRAM_BOT_TOKEN" as the name of a secret to set - so this looks
          # at values.
          from autotrader.dashboard import find_secrets
          leaks = find_secrets(data)
          if leaks:
              sys.exit("refusing to publish, credential-shaped data at: "
                       + "; ".join(leaks[:5]))
          print("no credentials in the payload")
          PY

      - uses: actions/configure-pages@v5
        with:
          # Sets the Pages source to "GitHub Actions" on first run, so nobody
          # has to find the setting by hand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      - run: echo "Dashboard published to ${{ steps.deploy.outputs.page_url }}"
